apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: linkding
resources:
  - ../../base/linkding
  - linkding-superuser.yaml
patches:
  - patch: |-
      apiVersion: apps/v1
      kind: Deployment
      metadata:
        name: linkding
      spec:
        template:
          spec:
            containers:
              - name: linkding
                env:
                  - name: LD_CSRF_TRUSTED_ORIGINS
                    value: https://ldpi.wojtektech.org
                envFrom:
                  - secretRef:
                      name: linkding-superuser